name: CI

# One run per change. Every change reaches master through a pull request, so
# the PR is where it is checked. Triggering on push as well ran the same code
# twice -- once for the branch push, once for the PR -- and a push trigger on
# master would add a third run after every merge.
#
# The trade-off: a commit pushed straight to master is not checked. That is
# outside the workflow, and workflow_dispatch below runs the check by hand from
# the Actions tab when master itself needs verifying.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same PR makes an in-flight run for it irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: it installs exactly what the lockfile says and fails
      # if the two have drifted, instead of quietly rewriting it.
      - name: Install
        id: install
        run: npm ci

      # Each check runs whether or not an earlier one failed, and the job still
      # fails if any of them did. By default a step only runs after the ones
      # before it succeeded, so the first failure ended the run: a PR whose
      # lint step failed was reported as a lint problem while the tests, the
      # build and the typecheck had never been run at all -- and was merged on
      # that reading. One failure should not decide what is known about the
      # rest.
      #
      # Install stays a gate, because nothing can run without it.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # Build comes before the typecheck, not after. next-env.d.ts and
      # .next/types hold the generated PageProps and LayoutProps globals that
      # the route files use, and both are gitignored -- so on a fresh checkout
      # tsc cannot resolve them until a build has produced them.
      #
      # No secrets are provided on purpose. The build does not read .env.local
      # -- verified by building with the file removed -- so a build that starts
      # needing credentials is a regression worth failing on.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # The one check that does depend on the step before it: without the
      # build's generated types tsc fails over globals rather than over the
      # code, which is noise, not a second opinion.
      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx tsc --noEmit
